version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9
    rebase-strategy: "disabled"

    groups:
      aws:
        patterns:
          - "github.com/aws/*"
        update-types:
          - minor
          - patch

      x:
        patterns:
          - "golang.org/x/*"
        update-types:
          - minor
          - patch
